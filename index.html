<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <section class="love-letter">

      <div class="envelope-area">

        <div id="envelope" class="envelope">

          <!-- Parte trasera -->
          <div class="envelope-back"></div>

          <!-- Carta -->
          <article class="letter">

            <div class="letter-header">
              <span>Para: El amor de mi vida</span>

              <span class="little-heart">♡</span>
            </div>

            <h2>Te amo, eres lo mejor que me ha pasado y este es solo el comienzo.</h2>

            <p>
              Eres la persona que me hace sonreir en cada momento.
            </p>

            <p>
              Gracias por ser parte de mi vida.
            </p>

            <div class="letter-decoration">
              ♥
            </div>

          </article>

          <!-- Tapa del sobre -->
          <div class="flap"></div>

          <!-- Partes delanteras -->
          <div class="front front-left"></div>
          <div class="front front-right"></div>
          <div class="front front-bottom"></div>

          <!-- Aquí aparecen los corazones -->
          <div
            id="heartsContainer"
            class="hearts-container"
          ></div>

        </div>

      </div>

      <div class="buttons">

        <button id="openButton" type="button">
          OPEN
        </button>

        <button id="closeButton" type="button">
          CLOSE
        </button>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
